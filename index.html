ration:7.4s;animation-delay:-4.2s\"><use href=\"#leaf-p2-s\" fill=\"#25652B\"><\/use><\/g><\/g><\/g>\n<path d=\"M47 88 L117 88 L110 155 L54 155 Z\" fill=\"#F3F1EC\"><\/path>\n<path d=\"M96 88 L117 88 L110 155 L93 155 Z\" fill=\"#E6E2DB\"><\/path>\n<\/svg>\n<\/div>\n<div class=\"ab-shelf\"><span class=\"ab-br ab-br--l\"><\/span><span class=\"ab-br ab-br--r\"><\/span><\/div>\n<\/div>\n<\/div>\n<\/div>\n<article class=\"ab-intro\">\n<h1 class=\"ab-hi\" id=\"ab-hi\" style=\"font-weight: 500; font-size: 30px\">Hi, I'm <span class=\"ab-nw\"><span class=\"ab-name\">Shweta!<\/span> <span class=\"ab-wave\" aria-hidden=\"true\">\ud83d\udc4b<\/span><\/span><\/h1>\n<div class=\"ab-lede\">\n<p>I'm a product designer, former engineer, and someone who's been doing Inktober for almost a decade!<\/p>\n<p>If you haven't heard of it, Inktober is a drawing challenge where artists create something every day in October based on a different prompt. I started in 2017 and have completed <span class=\"ab-pill\">8 years<\/span> of it so far!<\/p>\n<p>Over the years, I've tried different styles, materials, and ideas. Some drawings took hours, some were finished right before midnight, and some are honestly just silly. But every sketchbook reminds me of a different phase of my life, and I love looking back at them.<\/p>\n<p>Until now, all these drawings lived in physical sketchbooks and on my art Instagram, <a class=\"ab-inline\" href=\"https://www.instagram.com/snoozyunicorn/\" target=\"_blank\" rel=\"noopener noreferrer\">@snoozyunicorn<\/a>. I wanted to give them a little home of their own.<\/p>\n<p>So I experimented with vibe coding and built this interactive bookshelf with Claude!<\/p>\n<p>I wanted you to be able to pick up a book, flip through its pages, and discover all the little drawings inside. And of course, I had to add a sleepy cat and a few tiny animations along the way. \ud83d\udc08<\/p>\n<p>It's part art archive, part coding experiment, and mostly just me having fun bringing a random idea to life.<\/p>\n<p class=\"ab-sign\">Hope you have as much fun exploring it as I had building it! <span class=\"ab-heart\" aria-hidden=\"true\">\u2661<\/span><\/p>\n<div class=\"ab-contact\">\n<p>And if you made it this far, I'd love to hear from you! \ud83e\udd79<\/p>\n<p>Have a favorite drawing? Any feedback or ideas? Or just wanna say hi? Come find me here! \ud83d\udc8c<\/p>\n<p class=\"ab-links2\"><a href=\"mailto:theflowstateux@gmail.com\">\u2709\ufe0f Email me<\/a><span aria-hidden=\"true\">\u00b7<\/span><a href=\"https://www.instagram.com/theflowstate.ux/reels/?__d=1%253Futm_source%253Dig_embed\" target=\"_blank\" rel=\"noopener noreferrer\">\ud83d\udcf8 Instagram<\/a><\/p>\n<\/div>\n<\/div>\n<\/article>\n<\/div>\n<\/main>\n<\/sc-if>\n\n<sc-if value=\"{{hasOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"desk {{deskClass}}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"{{dialogLabel}}\" tabIndex=\"-1\" onKeyDown=\"{{onKey}}\" ref=\"{{refs.desk}}\">\n<div class=\"desk-bg\" aria-hidden=\"true\"><\/div>\n<div class=\"desk-head\">\n<p class=\"sr-only\" aria-live=\"polite\">{{spreadLabel}}<\/p>\n<\/div>\n<div class=\"rbar rbar--top\"><button class=\"rbtn\" onClick=\"{{close}}\" disabled=\"{{noClose}}\">\u2190 Back to shelf<\/button><\/div>\n\n<div class=\"stage3d {{stageClass}}\" style=\"{{stageStyle}}\" ref=\"{{refs.stage}}\">\n<div class=\"book3d\" style=\"{{bookStyle}}\">\n<div class=\"ribbon\" style=\"background-color: {{o.ribbon}}\"><\/div>\n<div class=\"spine-cloth\" style=\"background-color: {{o.dark}}\"><\/div>\n<div class=\"board-back\" style=\"background-color: {{o.color}}\"><div class=\"endpaper\" style=\"{{endpaperStyle}}\"><\/div><\/div>\n<div class=\"block block-r\" style=\"{{rStyle}}\"><\/div>\n<div class=\"block block-l\" style=\"{{lStyle}}\"><\/div>\n\n<sc-for list=\"{{leaves}}\" as=\"lf\" hint-placeholder-count=\"16\">\n<div class=\"leaf\" style=\"{{lf.style}}\">\n<div class=\"face face--front paper\">\n<sc-if value=\"{{l '\n }\n};\nvar PAGE_LEAVES = 17;\nvar MAX_FLIP = 17;\nvar SKIP = { 2023: [13, 15, 21] };\nvar NOTES = {\n \"2019\": {\n  \"t\": \"Where it all started\",\n  \"p\": [\n   {\n    \"x\": \"This year was a little bit of everything! I was drawing with ink on paper, and most of my drawings were either about something I cared about or something that made me laugh. Climate change, plastic pollution, mental health, Rick and Morty, BoJack Horseman, and of course, masala dosa made an appearance too. I was still figuring out what I wanted Inktober to be, so I just drew whatever came to mind.\"\n   }\n  ]\n },\n \"2020\": {\n  \"t\": \"Going digital\",\n  \"p\": [\n   {\n    \"x\": \"I got into drawing on my iPad with Procreate this year! Everything was white on black, and I started making little process videos of my drawings too. I even printed my artwork for the first time, which was such a cool feeling! A lot of my drawings were inspired by personal memories, my mom, the Andaman Islands, and even anxiety. But I still had room for silly ones like Dead inside, fancy outside.\"\n   }\n  ]\n },\n \"2021\": {\n  \"t\": \"An October playlist\",\n  \"p\": [\n   {\n    \"x\": \"I had this idea to connect every Inktober prompt to a song. So basically, 31 drawings inspired by 31 songs! My playlist went from David Bowie and Slipknot to Backstreet Boys, Daft Punk, Katy Perry, and Miley Cyrus. There was absolutely no musical consistency, haha. But it was so much fun finding a song for every prompt and turning it into a drawing.\"\n   }\n  ]\n },\n \"2022\": {\n  \"t\": \"My little art history experiment\",\n  \"p\": [\n   {\n    \"x\": \"This might be one of my favorite Inktober experiments! I wanted to explore a different art style every day, so I spent October learning about everything from Madhubani, Warli, Kalamkari, and Tanjore to Cubism, Bauhaus, Ukiyo-e, and artists like Dal\u00ed, Keith Haring, and Yayoi Kusama. I learned so much about art that month, and it was really fun trying to interpret the prompts through completely different styles.\"\n   }\n  ]\n },\n \"2023\": {\n  \"t\": \"Back to pen and paper\",\n  \"p\": [\n   {\n    \"x\": \"After a few years of experimenting, I went back to drawing with ink on paper. No particular theme this time. I just wanted to draw things I loved or things that reminded me of something. Murakami, The Matrix, Totoro, Pink Floyd, pani puri, and even a map connecting my hometown Belgaum to New York. I also tried an ink-dripping technique for the first time, and I was pretty excited when it actually worked!\"\n   }\n  ]\n },\n \"2024\": {\n  \"t\": \"Traveling through Figma\",\n  \"p\": [\n   {\n    \"x\": \"I spend so much time in Figma as a designer, so I thought, why not do an entire Inktober in it? This year's theme was travel, and every drawing was made using vectors in Figma. From backpacks and passports to Joshua Tree, Colorado, Alphonso mangoes, and marshmallow roasts. I also made little reels showing how I created them. Basically, my love for travel and design came together for 31 days.\"\n   }\n  ]\n },\n \"2025\": {\n  \"t\": \"A whole month of Miffy!\",\n  \"p\": [\n   {\n    \"x\": \"Yes, I really spent an entire October drawing Miffy. \ud83d\ude02\"\n   },\n   {\n    \"x\": \"Every prompt became a new little adventure for her. Miffy solving mysteries, knitting, skateboarding, lifting weights, celebrating Diwali, traveling, and even casting spells. I love how simple and adorable Miffy is, and honestly, drawing her in all these random situations made me so happy. I hope she makes you smile too!\"\n   }\n  ]\n },\n \"2026\": {\n  \"t\": \"A little collection of memories\",\n  \"p\": [\n   {\n    \"x\": \"This year I wanted to keep things simple. I picked up soft oil pastels and decided not to force a theme. Instead, I drew whatever each prompt reminded me of.\"\n   },\n   {\n    \"x\": \"My first NYC MetroCard, favorite hikes in Zion and Joshua Tree, a puppy who showed up at our house in 2013, Lady
